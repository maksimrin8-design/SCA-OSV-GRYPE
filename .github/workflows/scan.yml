name: SCA benchmark (OSV-Scanner vs Grype)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        name: Load and validate 30-project corpus
        run: |
          python - <<'PY'
          import json, os
          with open("projects/manifest.json", encoding="utf-8") as f:
              projects = json.load(f)["projects"]
          assert len(projects) == 30, f"Expected 30 projects, got {len(projects)}"
          assert len({p["repo"].lower() for p in projects}) == 30, "Duplicate repositories"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("matrix=" + json.dumps(projects, separators=(",", ":")) + "\n")
          PY

  scan:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        project: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout upstream project
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.project.repo }}
          ref: ${{ matrix.project.ref }}
          path: target-repo
          fetch-depth: 1
          persist-credentials: false

      - name: Record exact source revision and dependency manifests
        shell: bash
        run: |
          mkdir -p scan-output
          git -C target-repo rev-parse HEAD > scan-output/commit.txt
          git -C target-repo remote get-url origin > scan-output/upstream.txt
          find target-repo -type f | grep -E '/(package-lock\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml|pom\.xml|gradle\.lockfile|requirements[^/]*\.txt|Pipfile\.lock|poetry\.lock|uv\.lock|go\.mod|go\.sum|Cargo\.lock|Gemfile\.lock|composer\.lock)$' | sort > scan-output/dependency-files.txt || true
          cat > scan-output/project.json <<EOF
          {"project_id":"${{ matrix.project.id }}","name":"${{ matrix.project.name }}","repository":"${{ matrix.project.repo }}","requested_ref":"${{ matrix.project.ref }}"}
          EOF

      - name: Install OSV-Scanner
        run: |
          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o osv-scanner
          chmod +x osv-scanner
          sudo install osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version | tee scan-output/osv-version.txt

      - name: Run OSV-Scanner
        shell: bash
        run: |
          set +e
          osv-scanner scan source -r target-repo --format json --output-file scan-output/osv-result.json
          code=$?
          set -e
          echo "$code" > scan-output/osv-exit-code.txt
          test -s scan-output/osv-result.json || echo '{"results":[]}' > scan-output/osv-result.json

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype version | tee scan-output/grype-version.txt

      - name: Run Grype
        shell: bash
        run: |
          set +e
          grype dir:target-repo -o json --file scan-output/grype-result.json
          code=$?
          set -e
          echo "$code" > scan-output/grype-exit-code.txt
          test -s scan-output/grype-result.json || echo '{"matches":[]}' > scan-output/grype-result.json

      - name: Upload per-project evidence
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ matrix.project.id }}-${{ matrix.project.name }}
          path: scan-output/
          if-no-files-found: error
          retention-days: 30

  compare:
    needs: [prepare, scan]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download scan evidence
        uses: actions/download-artifact@v4
        with:
          pattern: scan-*
          path: all-results
          merge-multiple: false
      - name: Compare only verified ground truth
        run: |
          python scripts/compare_ground_truth.py \
            --results-dir all-results \
            --ground-truth ground-truth/expected-vulnerabilities.csv \
            --output-dir comparison
      - name: Upload comparison and provenance
        uses: actions/upload-artifact@v4
        with:
          name: sca-benchmark-comparison
          path: comparison/
          if-no-files-found: error
          retention-days: 90
