name: Batch Vulnerability Scan

on:
  workflow_dispatch:

jobs:
  scan-osv:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "juice-shop"
            repo: "juice-shop/juice-shop"
          - name: "webgoat"
            repo: "WebGoat/WebGoat"
          - name: "dvwa"
            repo: "digininja/DVWA"
          - name: "vuln-bookstore"
            repo: "tobiasbruss/vulnerable-repo"
          - name: "vulnshop"
            repo: "nr-yolo/Vulnshop"
          - name: "railsgoat"
            repo: "OWASP/railsgoat"
          - name: "nodegoat"
            repo: "OWASP/NodeGoat"
          - name: "vulnerableapp"
            repo: "SasanLabs/VulnerableApp"
          - name: "goof"
            repo: "snyk-labs/nodejs-goof"
          - name: "bwapp"
            repo: "raesene/bWAPP"
          - name: "mutillidae"
            repo: "webpwnized/mutillidae"
          - name: "crapi"
            repo: "OWASP/crAPI"
          - name: "dv-graphql"
            repo: "dolevf/Damn-Vulnerable-GraphQL-Application"
          - name: "nodevulnerable"
            repo: "OWASP/NodeVulnerable"
          # --- Новые 6 проектов (до 20) ---
          - name: "owasp-pygoat"
            repo: "OWASP/pygoat"
          - name: "vulnerable-flask-app"
            repo: "anil-yelken/Vulnerable-Flask-App"
          - name: "xvwa"
            repo: "s4n7h0/xvwa"
          - name: "webgoat-net"
            repo: "jerryhoff/WebGoat.NET"
          - name: "vulnerable-otp"
            repo: "mddanish/Vulnerable-OTP-Application"
          - name: "vulnado"
            repo: "vincenzo-veracode/vulnado"

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.TARGET_REPO_TOKEN }}
          path: target-repo

      - name: Install OSV Scanner
        run: |
          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o osv-scanner
          chmod +x osv-scanner
          sudo mv osv-scanner /usr/local/bin/

      - name: Run OSV Scanner (JSON)
        continue-on-error: true
        run: |
          cd target-repo
          osv-scanner scan source -r . --format json --output-file ../osv-result.json || true

      - name: Upload OSV JSON
        uses: actions/upload-artifact@v4
        with:
          name: osv-${{ matrix.name }}
          path: osv-result.json
          if-no-files-found: warn

  scan-grype:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "juice-shop"
            repo: "juice-shop/juice-shop"
          - name: "webgoat"
            repo: "WebGoat/WebGoat"
          - name: "dvwa"
            repo: "digininja/DVWA"
          - name: "vuln-bookstore"
            repo: "tobiasbruss/vulnerable-repo"
          - name: "vulnshop"
            repo: "nr-yolo/Vulnshop"
          - name: "railsgoat"
            repo: "OWASP/railsgoat"
          - name: "nodegoat"
            repo: "OWASP/NodeGoat"
          - name: "vulnerableapp"
            repo: "SasanLabs/VulnerableApp"
          - name: "goof"
            repo: "snyk-labs/nodejs-goof"
          - name: "bwapp"
            repo: "raesene/bWAPP"
          - name: "mutillidae"
            repo: "webpwnized/mutillidae"
          - name: "crapi"
            repo: "OWASP/crAPI"
          - name: "dv-graphql"
            repo: "dolevf/Damn-Vulnerable-GraphQL-Application"
          - name: "nodevulnerable"
            repo: "OWASP/NodeVulnerable"
          # --- Новые 6 проектов (до 20) ---
          - name: "owasp-pygoat"
            repo: "OWASP/pygoat"
          - name: "vulnerable-flask-app"
            repo: "anil-yelken/Vulnerable-Flask-App"
          - name: "xvwa"
            repo: "s4n7h0/xvwa"
          - name: "webgoat-net"
            repo: "jerryhoff/WebGoat.NET"
          - name: "vulnerable-otp"
            repo: "mddanish/Vulnerable-OTP-Application"
          - name: "vulnado"
            repo: "vincenzo-veracode/vulnado"

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.TARGET_REPO_TOKEN }}
          path: target-repo

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Run Grype (JSON)
        continue-on-error: true
        run: |
          grype dir:target-repo -o json --file grype-result.json || true

      - name: Upload Grype JSON
        uses: actions/upload-artifact@v4
        with:
          name: grype-${{ matrix.name }}
          path: grype-result.json
          if-no-files-found: warn

  merge-results:
    needs: [scan-osv, scan-grype]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-results

      - name: Restructure and fetch reference READMEs
        run: |
          mkdir -p final-output
          
          # Список всех 20 проектов для скачивания README (эталонов)
          PROJECTS=(
            "juice-shop|juice-shop/juice-shop"
            "webgoat|WebGoat/WebGoat"
            "dvwa|digininja/DVWA"
            "vuln-bookstore|tobiasbruss/vulnerable-repo"
            "vulnshop|nr-yolo/Vulnshop"
            "railsgoat|OWASP/railsgoat"
            "nodegoat|OWASP/NodeGoat"
            "vulnerableapp|SasanLabs/VulnerableApp"
            "goof|snyk-labs/nodejs-goof"
            "bwapp|raesene/bWAPP"
            "mutillidae|webpwnized/mutillidae"
            "crapi|OWASP/crAPI"
            "dv-graphql|dolevf/Damn-Vulnerable-GraphQL-Application"
            "nodevulnerable|OWASP/NodeVulnerable"
            "owasp-pygoat|OWASP/pygoat"
            "vulnerable-flask-app|anil-yelken/Vulnerable-Flask-App"
            "xvwa|s4n7h0/xvwa"
            "webgoat-net|jerryhoff/WebGoat.NET"
            "vulnerable-otp|mddanish/Vulnerable-OTP-Application"
            "vulnado|vincenzo-veracode/vulnado"
          )
          
          for entry in "${PROJECTS[@]}"; do
            name="${entry%%|*}"
            repo="${entry#*|}"
            
            mkdir -p "final-output/$name/default"
            mkdir -p "final-output/$name/osv"
            mkdir -p "final-output/$name/grype"
            
            # Скачиваем README (пробуем ветку main, если нет - master)
            curl -sL "https://raw.githubusercontent.com/$repo/main/README.md" -o "final-output/$name/default/reference.md" || \
            curl -sL "https://raw.githubusercontent.com/$repo/master/README.md" -o "final-output/$name/default/reference.md" || true
          done
          
          # Переносим скачанные JSON-файлы в нужные папки
          for dir in all-results/*; do
            if [ -d "$dir" ]; then
              folder_name=$(basename "$dir")
              tool="${folder_name%%-*}"      # osv или grype
              project="${folder_name#*-}"    # имя проекта
              
              # Проверяем, что такая папка проекта была создана
              if [ -d "final-output/$project" ]; then
                if [ -f "$dir/${tool}-result.json" ]; then
                  cp "$dir/${tool}-result.json" "final-output/$project/$tool/result.json"
                fi
              fi
            fi
          done

      - name: Upload Final Structure
        uses: actions/upload-artifact@v4
        with:
          name: final-vulnerability-report
          path: final-output/
